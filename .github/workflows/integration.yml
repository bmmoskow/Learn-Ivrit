name: Integration

on:
  push:
    branches: [integration]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  development-checks:
    name: Development Checks
    uses: ./.github/workflows/development.yml
    with:
      skip_promote: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: development-checks
    environment: pipeline
    # Run on a real push to `integration` OR `ui` — both are allowed by the
    # `pipeline` environment's branch policy. Skips on `main`: when main.yml
    # re-invokes this via workflow_call the ref is `main`, which pipeline does
    # NOT allow, so integration tests never run against production. Net effect:
    # they gate both the integration->ui and ui->main promotions, but not prod.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/ui')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PUBLIC test-project ref (a variable, not a secret). The vitest config
          # refuses to run unless the target URL contains this — the CI prod guard.
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}

  promote-to-ui:
    name: Promote to UI
    runs-on: ubuntu-latest
    needs: [development-checks, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to ui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ui:ui
          git checkout ui
          git merge --no-ff origin/integration -m "${{ steps.get-message.outputs.message }}"
          git push origin ui

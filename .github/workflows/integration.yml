name: Integration

on:
  push:
    branches: [integration]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  development-checks:
    name: Development Checks
    uses: ./.github/workflows/development.yml
    with:
      skip_promote: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: development-checks
    environment: pipeline
    # Integration tests run ONLY on a push to the `integration` branch.
    # The cheap base checks (lint/typecheck/unit/build) still re-run at every
    # stage via the nested workflow_call — kept deliberately, so the pipeline
    # stays correct if branches ever diverge (a second contributor) or a stage
    # becomes a real deployed environment. But the integration suite is
    # DB-dependent, and environment SECRETS don't propagate into the ui/main
    # workflow_call chains (only variables do) — so it runs once, here, at the
    # integration stage, which already gates promotion all the way to main.
    # Skipped everywhere else (ref != integration), so it never hits prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PUBLIC test-project ref (a variable, not a secret). The vitest config
          # refuses to run unless the target URL contains this — the CI prod guard.
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}

  promote-to-ui:
    name: Promote to UI
    runs-on: ubuntu-latest
    needs: [development-checks, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to ui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ui:ui
          git checkout ui
          git merge --no-ff origin/integration -m "${{ steps.get-message.outputs.message }}"
          git push origin ui

name: Integration

on:
  push:
    branches: [integration]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  development-checks:
    name: Development Checks
    uses: ./.github/workflows/development.yml
    with:
      skip_promote: true

  db-push-test:
    name: Push migrations to test DB
    needs: development-checks
    # Push pending migrations to the TEST DB before the integration tests run, so
    # they run against the current schema. Reusable db-push workflow, targeting the
    # `pipeline` environment (`secrets: inherit` gives it the env's DB password).
    # Only on a real push to `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/db-push.yml
    with:
      environment: pipeline
    secrets: inherit

  db-advisors-test:
    name: DB security advisors (test)
    needs: [db-push-test, deploy-functions-test]
    # Lint the test DB for security problems AFTER the migrations are applied, so
    # a schema change that weakens RLS/policies is caught before it can promote.
    # Runs in the post-deploy phase (B), in PARALLEL with the integration tests.
    # Reusable db-advisors workflow, `pipeline` environment. Only on a real push
    # to `integration`. Fails the pipeline on any ERROR-level finding.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/db-advisors.yml
    with:
      environment: pipeline
    secrets: inherit

  deploy-functions-test:
    name: Deploy edge functions (test)
    needs: development-checks
    # Deploy edge functions to the TEST project. Independent of the migration
    # push, so it runs in PARALLEL with db-push-test (phase A). Reusable
    # deploy-functions workflow, `pipeline` environment. Only on a real push to
    # `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/deploy-functions.yml
    with:
      environment: pipeline
    secrets: inherit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [db-push-test, deploy-functions-test]
    environment: pipeline
    # Integration tests run ONLY on a push to the `integration` branch — once,
    # here, gating promotion all the way to main. The cheap base checks still
    # re-run at every stage (kept deliberately for a future where branches diverge
    # or a stage becomes a deployed environment). Skipped elsewhere, so never prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PUBLIC test-project ref (a variable, not a secret). The vitest config
          # refuses to run unless the target URL contains this — the CI prod guard.
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  signup-roundtrip:
    name: Sign-up round-trip (ephemeral local stack)
    runs-on: ubuntu-latest
    needs: [db-push-test, deploy-functions-test]
    # Full sign-up → emailed-code → use → delete round-trip. Runs its OWN throwaway
    # local Supabase stack IN THE RUNNER (with email confirmations ON) because it
    # must read the emailed 6-digit code back from the local mailbox
    # (Inbucket/Mailpit) — something the remote TEST project can't provide. Needs
    # no hosted project and no new secret: the service-role key comes from the
    # local stack via `npm run sandbox:env`.
    #
    # PHASE: runs in the post-deploy VERIFY phase (B), in PARALLEL with the
    # integration tests and the DB security advisors. It stands up its own local
    # stack, so it has no real data-dependency on the remote deploys — the
    # `needs: [db-push-test, deploy-functions-test]` is there to place it in the
    # same phase as the other verification jobs rather than ahead of them.
    #
    # GATING: listed in promote-to-ui's `needs`, so a failure here BLOCKS
    # integration→ui promotion. Only on a real push to `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned to match db-push.yml / deploy-functions.yml. NOT `latest`:
          # an unpinned `latest` is what silently adopted CLI 3.0.0 and broke the
          # pipeline (see the v3 migration, PRs #273–#276).
          version: 3.0.0

      - name: Enable email confirmations (throwaway checkout only, never committed)
        # The committed config keeps enable_confirmations = false so local dev and
        # the other suites keep auto-confirming. Flip it ON only for this
        # ephemeral stack, so signups email a real 6-digit code.
        run: sed -i 's/^enable_confirmations = false/enable_confirmations = true/' supabase/config.toml

      - name: Start ephemeral local stack (fresh free ports per attempt)
        # `supabase start` occasionally dies with "failed to bind host port
        # 0.0.0.0:54322/tcp: address already in use": a partial/rolled-back start
        # can leave the host-port binding held briefly, so a plain retry on the
        # fixed port could lose every attempt to one stuck port. This starter picks
        # fresh free ports (api/db/shadow/studio) on each of 3 attempts, so a retry
        # never reuses a wedged port. [local_smtp] stays on 54324 (the mail readers
        # default to it). See scripts/ci-start-ephemeral-stack.mjs. The sed above
        # runs first; the starter only rewrites port lines, preserving it.
        run: node scripts/ci-start-ephemeral-stack.mjs

      - name: Write .env.local from the running stack (incl. service-role key)
        run: npm run sandbox:env

      - name: Run sign-up round-trip suite
        run: npm run test:signup-roundtrip:run

      - name: Stop ephemeral local stack
        if: always()
        run: supabase stop || true

  integration-tests-local:
    name: Integration Tests (ephemeral local stack)
    runs-on: ubuntu-latest
    needs: [db-push-test, deploy-functions-test]
    # The remote `integration-tests` job above runs `npm run test:integration`
    # against the remote TEST project with only the anon key — so the
    # service-role-only suites (e.g. translationCache.integrationtest.tsx, which
    # seeds the service-role-only `translation_cache` table and reads admin-only
    # `api_usage_logs`) guard themselves with `describe.skipIf(!admin)` and
    # SILENTLY SKIP there. This job runs the SAME suite against its OWN throwaway
    # local Supabase stack IN THE RUNNER, which issues a real service-role key via
    # `npm run sandbox:env`, so those suites actually EXECUTE. Mirrors
    # `signup-roundtrip` above (own local stack, no hosted project, no new secret).
    #
    # PHASE: runs in the post-deploy VERIFY phase (B), in PARALLEL with the remote
    # integration tests, the DB advisors, and the sign-up round-trip. It stands up
    # its own local stack, so it has no real data-dependency on the remote
    # deploys — the `needs: [db-push-test, deploy-functions-test]` only places it
    # in the same phase as the other verification jobs.
    #
    # GATING: deliberately NOT in promote-to-ui's `needs` yet, so it is
    # NON-BLOCKING for promotion while it proves out through its first promotion
    # cycle. Flip it to gating (add `integration-tests-local` to promote-to-ui's
    # `needs`) in a follow-up once it has been observed green. Only on a real push
    # to `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned to match db-push.yml / deploy-functions.yml / signup-roundtrip.
          # NOT `latest`: an unpinned `latest` is what silently adopted CLI 3.0.0
          # and broke the pipeline (see the v3 migration, PRs #273–#276).
          version: 3.0.0

      # NOTE: unlike signup-roundtrip, this job does NOT flip
      # enable_confirmations. The integration suite auto-confirms its users via
      # the `createTestUser` helper (signUp against the committed config where
      # enable_confirmations = false); flipping confirmations ON would make those
      # signups require an emailed code and break the suite.

      - name: Start ephemeral local stack (fresh free ports per attempt)
        # Same free-port starter as signup-roundtrip: picks fresh
        # api/db/shadow/studio ports on each of 3 attempts, so a retry never
        # reuses a port a rolled-back start left wedged (the old fixed-port retry
        # could lose all 3 attempts to one stuck 54322). [local_smtp] stays 54324.
        # See scripts/ci-start-ephemeral-stack.mjs.
        run: node scripts/ci-start-ephemeral-stack.mjs

      - name: Write .env.local from the running stack (incl. service-role key)
        run: npm run sandbox:env

      - name: Run integration tests against the local stack
        run: npm run test:integration
        env:
          # Run as a LOCAL invocation (CI unset) ON PURPOSE. Unlike
          # vitest.roundtrip.config.ts, vitest.integration.config.ts branches on
          # `process.env.CI`: when CI is truthy it resolves the target from
          # process.env (the remote TEST project) and IGNORES .env.local. With CI
          # cleared it takes the local path — reading VITE_SUPABASE_URL,
          # VITE_SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY from the
          # .env.local that `sandbox:env` just wrote — which is exactly the
          # known-good `npm run test:integration` path a developer runs against the
          # sandbox. The prod guard accepts the localhost target (127.0.0.1:54321)
          # with no EXPECTED_SUPABASE_PROJECT_REF, so we deliberately do NOT set
          # that var here.
          CI: ''

      - name: Stop ephemeral local stack
        if: always()
        run: supabase stop || true

  promote-to-ui:
    name: Promote to UI
    needs: [integration-tests, db-advisors-test, signup-roundtrip]
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration' && inputs.skip_promote != true
    uses: ./.github/workflows/promote.yml
    with:
      source: integration
      target: ui
    secrets:
      token: ${{ secrets.PAT_TOKEN }}

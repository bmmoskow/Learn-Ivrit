name: Integration

on:
  push:
    branches: [integration]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  development-checks:
    name: Development Checks
    uses: ./.github/workflows/development.yml
    with:
      skip_promote: true

  db-push-test:
    name: Push migrations to test DB
    needs: development-checks
    # Push pending migrations to the TEST DB before the integration tests run, so
    # they run against the current schema. Reusable db-push workflow, targeting the
    # `pipeline` environment (`secrets: inherit` gives it the env's DB password).
    # Only on a real push to `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/db-push.yml
    with:
      environment: pipeline
    secrets: inherit

  db-advisors-test:
    name: DB security advisors (test)
    needs: db-push-test
    # Lint the test DB for security problems AFTER the migrations are applied, so
    # a schema change that weakens RLS/policies is caught before it can promote.
    # Reusable db-advisors workflow, `pipeline` environment. Only on a real push
    # to `integration`. Fails the pipeline on any ERROR-level finding.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/db-advisors.yml
    with:
      environment: pipeline
    secrets: inherit

  deploy-functions-test:
    name: Deploy edge functions (test)
    needs: db-push-test
    # Deploy edge functions to the TEST project after the schema is pushed, so
    # they run against the current schema. Reusable deploy-functions workflow,
    # `pipeline` environment. Only on a real push to `integration`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    uses: ./.github/workflows/deploy-functions.yml
    with:
      environment: pipeline
    secrets: inherit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [development-checks, db-push-test]
    environment: pipeline
    # Integration tests run ONLY on a push to the `integration` branch — once,
    # here, gating promotion all the way to main. The cheap base checks still
    # re-run at every stage (kept deliberately for a future where branches diverge
    # or a stage becomes a deployed environment). Skipped elsewhere, so never prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PUBLIC test-project ref (a variable, not a secret). The vitest config
          # refuses to run unless the target URL contains this — the CI prod guard.
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  promote-to-ui:
    name: Promote to UI
    runs-on: ubuntu-latest
    needs: [development-checks, integration-tests, db-advisors-test, deploy-functions-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to ui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ui:ui
          git checkout ui
          git merge --no-ff origin/integration -m "${{ steps.get-message.outputs.message }}"
          git push origin ui

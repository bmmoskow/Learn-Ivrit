name: Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  base-checks:
    name: Base Checks
    uses: ./.github/workflows/base-checks.yml
    with:
      skip_promote: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: base-checks
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  promote-to-integration:
    name: Promote to Integration
    needs: [base-checks, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && inputs.skip_promote != true
    uses: ./.github/workflows/promote.yml
    with:
      source: development
      target: integration
    secrets:
      token: ${{ secrets.PAT_TOKEN }}

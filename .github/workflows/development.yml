name: Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  base-checks:
    name: Base Checks
    uses: ./.github/workflows/base-checks.yml
    with:
      skip_promote: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: base-checks
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  promote-to-integration:
    name: Promote to Integration
    runs-on: ubuntu-latest
    needs: [base-checks, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry to survive a concurrent promotion pushing to integration between
          # our fetch and push (non-fast-forward). Each attempt re-fetches the
          # moved target and re-merges, so the other promotion is absorbed. A
          # genuine merge conflict is NOT retried -- it fails for manual resolution.
          MSG="${{ steps.get-message.outputs.message }}"
          for attempt in $(seq 1 5); do
            git fetch origin integration development
            git checkout -B integration origin/integration
            if ! git merge --no-ff origin/development -m "$MSG"; then
              git merge --abort || true
              echo "::error::Merge conflict promoting development -> integration; manual resolution needed."
              exit 1
            fi
            if git push origin integration; then
              echo "Promoted to integration on attempt $attempt."
              exit 0
            fi
            echo "integration advanced during promotion; refreshing and retrying (attempt $attempt)..."
            sleep $(( attempt * 5 + RANDOM % 5 ))
          done
          echo "::error::Could not promote to integration after 5 attempts (it kept advancing)."
          exit 1

name: Deploy edge functions

# Reusable workflow: deploy all Supabase edge functions to a target environment's
# project. Called by integration.yml (test) and main.yml (prod). Mirrors
# db-push.yml — environment-agnostic names read directly from whichever
# environment the caller selects, with `secrets: inherit`.
#
# `supabase functions deploy` (no function name) deploys every function under
# supabase/functions/, applying each one's settings from supabase/config.toml
# (notably verify_jwt). It never removes functions that aren't in the repo.
#
# AUTH: needs SUPABASE_ACCESS_TOKEN — a Supabase personal access token
# (account-scoped; there is no project-scoped deploy token). Runtime function
# secrets (GEMINI_API_KEY, RESEND_API_KEY, ...) are NOT touched here: deploying
# code leaves them intact, and `supabase secrets set` stays a manual step.
#
# FAIL-SAFE: skips (green no-op) if the ref or token isn't configured yet.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to target (pipeline = test, deployment = prod).
        required: true
        type: string

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::deploy-functions: missing SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN in the '${{ inputs.environment }}' environment — skipping."
            exit 0
          fi
          # Deploys ALL functions, reading per-function config (verify_jwt) from
          # supabase/config.toml. Fails the job if any function fails to deploy.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

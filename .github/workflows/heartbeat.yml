name: Heartbeat

# Scheduled run of the whole verification battery, to catch SILENT breakage that
# happens between pushes — expired credentials, newly-disclosed dependency CVEs,
# a test-DB/schema regression, prod going down. The push pipeline only runs when
# someone pushes; this watches the clock. A failed scheduled run emails the repo
# owner by default — that email is the alert.
#
# It reuses the same checks the pipeline uses (development.yml, security.yml) so
# there's no duplicated logic — only a different (scheduled) trigger — plus a
# read-only prod probe.
#
# Full suite runs against the TEST project (safe to exercise); PROD gets a
# read-only probe (never written to).
#
# NOTE: scheduled runs only fire when this file is on the DEFAULT branch (main).
# Until then, exercise it with "Run workflow" (workflow_dispatch) once it's on a
# branch. The integration job needs the repo-level TEST_SUPABASE_* values and
# skips cleanly until TEST_SUPABASE_ANON_KEY is set.
on:
  schedule:
    - cron: "0 13 * * *"   # daily ~06:00 PT
  workflow_dispatch: {}

concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  security-events: write

jobs:
  # --- Full check suite against the TEST project ---

  code-checks:
    name: Code checks
    # lint / typecheck / build / unit (incl. UI component tests). skip_promote
    # keeps it from trying to advance any branch.
    uses: ./.github/workflows/development.yml
    with:
      skip_promote: true
    secrets: inherit

  security:
    name: Security scan
    # npm audit / CodeQL / Trivy — the scheduled run catches newly-disclosed CVEs.
    uses: ./.github/workflows/security.yml

  integration:
    name: Integration tests (test DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against the test project
        # Uses REPO-LEVEL test values (non-secret) so this runs on main without
        # touching the pipeline environment. The vitest config's prod guard
        # (EXPECTED_SUPABASE_PROJECT_REF) refuses to run unless the target URL is
        # the test project, so this can never hit prod. Skips until configured.
        env:
          VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.TEST_SUPABASE_REF }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Heartbeat integration: repo-level TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY / TEST_SUPABASE_REF not all set — skipping until configured."
            exit 0
          fi
          npm run test:integration

  # --- Live checks ---

  site:
    name: Live site
    runs-on: ubuntu-latest
    steps:
      - name: learn-ivrit.com responds and serves its app bundle
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --max-time 20 https://learn-ivrit.com)
          [ "$code" = "200" ] || { echo "::error::learn-ivrit.com returned HTTP $code"; exit 1; }
          js=$(grep -oE '/assets/index-[^"]+\.js' /tmp/index.html | head -1)
          [ -n "$js" ] || { echo "::error::No app bundle referenced in the served HTML (build/deploy may be broken)."; exit 1; }
          jscode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://learn-ivrit.com${js}")
          [ "$jscode" = "200" ] || { echo "::error::App bundle ${js} returned HTTP $jscode"; exit 1; }
          echo "Site OK (HTML 200, bundle ${js} 200)."

  prod-probe:
    name: Prod probe (read-only)
    uses: ./.github/workflows/prod-probe.yml
    secrets: inherit

  prod-advisors:
    name: Prod DB security advisors (read-only)
    # Re-lint the PROD schema on a timer so an out-of-band change made directly
    # in the Supabase dashboard (RLS disabled, a permissive policy added, a view
    # flipped) is caught even though no migration ran. Read-only; same reusable
    # workflow the main stage uses, targeting the `deployment` environment.
    uses: ./.github/workflows/db-advisors.yml
    with:
      environment: deployment
    secrets: inherit

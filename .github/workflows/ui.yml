  promote-to-main:
    name: Promote to Main
    runs-on: ubuntu-latest
    needs: [integration-checks]
    #    needs: [integration-checks, e2e-tests, deep-security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          git merge --no-ff origin/ui -m "${{ steps.get-message.outputs.message }}"
          git push origin main

name: UI

on:
  push:
    branches: [ui]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  integration-checks:
    name: Integration Checks
    uses: ./.github/workflows/integration.yml
    with:
      skip_promote: true

  # Two separate browser-test suites, each a distinct job via the shared
  # reusable workflow (.github/workflows/playwright.yml). Kept apart on purpose:
  # different backends and different failure profiles. Neither is in
  # promote-to-main's `needs` yet, so both are non-blocking for now.
  ui-tests:
    name: UI Tests (mocked backend)
    needs: integration-checks
    # Real-browser UI tests with a MOCKED backend (tests/ui) — deterministic.
    # A good candidate to GATE promotion once the mocked suite is comprehensive.
    # Only on a real push to `ui` (skipped when main.yml calls this workflow).
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui'
    uses: ./.github/workflows/playwright.yml
    with:
      suite: ui
      environment: pipeline
    secrets: inherit

  e2e-tests:
    name: E2E Tests (real backend)
    needs: integration-checks
    # Real-browser E2E against the real TEST backend (tests/e2e). Flakier, so
    # kept non-blocking. Only on a real push to `ui`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui'
    uses: ./.github/workflows/playwright.yml
    with:
      suite: e2e
      environment: pipeline
    secrets: inherit

  promote-to-main:
    name: Promote to Main
    runs-on: ubuntu-latest
    needs: [integration-checks]
    # To gate promotion on the browser suites, add ui-tests (and optionally
    # e2e-tests) here once they're trusted. Deep SAST (CodeQL + Trivy) is NOT
    # run here on purpose — it lives in security.yml (main stage + scheduled
    # heartbeat), so running it at the ui stage would only duplicate it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui' && inputs.skip_promote != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get original merge message
        id: get-message
        run: |
          ORIGINAL_MSG=$(git log -1 --format=%s HEAD)
          echo "message=$ORIGINAL_MSG" >> $GITHUB_OUTPUT

      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          git merge --no-ff origin/ui -m "${{ steps.get-message.outputs.message }}"
          git push origin main

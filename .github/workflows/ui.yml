name: UI

on:
  push:
    branches: [ui]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  integration-checks:
    name: Integration Checks
    uses: ./.github/workflows/integration.yml
    with:
      skip_promote: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-checks
    environment: pipeline
    # Playwright E2E against the PRODUCTION build served by vite preview (see
    # playwright.config.ts). Runs the smoke spec only for now: it validates the
    # harness end to end and is deterministic. Deliberately NOT in
    # promote-to-main's `needs`, so a failure can't block promotion while the
    # richer e2e specs are still being hardened. The build reads the `pipeline`
    # (test project) VITE_* secrets, so the app never points at prod. Runs only
    # on a real push to `ui` (skipped when main.yml calls this workflow).
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e:smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


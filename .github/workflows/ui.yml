name: UI

on:
  push:
    branches: [ui]
  workflow_call:
    inputs:
      skip_promote:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
jobs:
  integration-checks:
    name: Integration Checks
    uses: ./.github/workflows/integration.yml
    with:
      skip_promote: true

  # Two separate browser-test suites, each a distinct job via the shared
  # reusable workflow (.github/workflows/playwright.yml). Kept apart on purpose:
  # different backends and different failure profiles. Both are in
  # promote-to-main's `needs`, so both now GATE promotion to main.
  ui-tests:
    name: UI Tests (mocked backend)
    needs: integration-checks
    # Real-browser UI tests with a MOCKED backend (tests/ui) — deterministic.
    # GATES promotion to main (listed in promote-to-main's needs).
    # Only on a real push to `ui` (skipped when main.yml calls this workflow).
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui'
    uses: ./.github/workflows/playwright.yml
    with:
      suite: ui
      environment: pipeline
    secrets: inherit

  e2e-tests:
    name: E2E Tests (real backend)
    needs: integration-checks
    # Real-browser E2E against the real TEST backend (tests/e2e). Now GATES
    # promotion to main (listed in promote-to-main's needs); if its flakiness
    # blocks promotion too often, add a retry or drop it from that list. Only
    # on a real push to `ui`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui'
    uses: ./.github/workflows/playwright.yml
    with:
      suite: e2e
      environment: pipeline
    secrets: inherit

  promote-to-main:
    name: Promote to Main
    needs: [integration-checks, ui-tests, e2e-tests]
    # Promotion to main is GATED on both browser suites — ui-tests (mocked) and
    # e2e-tests (real backend) must pass before ui promotes to main. If e2e
    # flakiness blocks promotion too often, add a retry to the suite or drop
    # e2e-tests from this list to make it non-blocking again. Deep SAST (CodeQL
    # + Trivy) is NOT run here on purpose — it lives in security.yml (main stage
    # + scheduled heartbeat), so running it at the ui stage would only duplicate it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui' && inputs.skip_promote != true
    uses: ./.github/workflows/promote.yml
    with:
      source: ui
      target: main
    secrets:
      token: ${{ secrets.PAT_TOKEN }}

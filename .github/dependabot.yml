# Dependabot configuration.
#
# target-branch sends Dependabot's VERSION-update PRs to `development` so they
# flow through the pipeline (development -> integration -> ui -> main) instead of
# landing directly on main and bypassing the checks.
#
# NOTE: target-branch does NOT apply to SECURITY updates. Dependabot always opens
# security PRs against the repository's DEFAULT branch (main), ignoring this
# setting. Those are handled by applying the same bump on a development-targeted
# PR; see project memory / PR #218.
#
# NOTE: Dependabot reads this file from the DEFAULT branch (main), so changes here
# only take effect once they reach main via the pipeline.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"

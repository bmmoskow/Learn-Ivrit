# Supabase local-dev config, used by `supabase start` / `supabase db reset` to
# run the full stack in Docker. See docs/local-sandbox.md.
#
# NOTE: written to the standard config.toml schema. If your Supabase CLI version
# rejects a key, run `supabase init` to regenerate a canonical file, then re-add
# the [auth.email] enable_confirmations=false and the [functions.*] verify_jwt
# entries below.

project_id = "learn-ivrit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match production's Postgres major version (prod is 17.x) so the baseline
# schema behaves identically on the local stack.
major_version = 17

[studio]
enabled = true
port = 54323

# Local inbox (Mailpit) that captures auth emails (confirmations, magic links)
# so nothing leaves the machine during development. Renamed from [inbucket] to
# [local_smtp] for Supabase CLI v3, which rejects the old section name. Port
# 54324 is the web UI / HTTP API the tests read the captured mail from.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Mirror the remote test project (mailer_autoconfirm): local test signups
# complete without an email-confirmation step, so integration tests can create
# users directly.
enable_confirmations = false

[auth.email.template.confirmation]
# Surfaces the 6-digit code ({{ .Token }}) in the signup confirmation email so the
# sign-up round-trip test can read it back from the local mailbox. INERT while
# enable_confirmations = false above (no confirmation email is ever sent); used
# only when the flag is flipped ON for the throwaway round-trip stack — the CI
# job, or `npm run test:signup-roundtrip` locally. See supabase/templates/.
content_path = "./supabase/templates/confirmation.html"

# Edge functions — keep the same verify_jwt settings as production.
[functions.gemini-translate]
verify_jwt = false

[functions.sefaria-fetch]
verify_jwt = false

[functions.generate-hebrew-passage]
verify_jwt = false

[functions.send-contact-email]
verify_jwt = false
